<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>View Job</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f3f4f6;
  margin:0;
}

.navbar {
  background:#111827;
  padding:14px;
}

.nav-links a {
  color:white;
  margin-right:15px;
  text-decoration:none;
}

.card-form {
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.job-banner {
  position:relative;
  height:280px;
  background:#0854ec;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  overflow:hidden;
}

/* Dark overlay */
.job-banner::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
}

/* Banner text */
.banner-text {
  position:relative;
  z-index:2;
  font-size:28px;
  font-weight:bold;
  text-align:center;
}

/* Loading spinner */
.loader {
  width:40px;
  height:40px;
  border:4px solid rgba(255,255,255,0.4);
  border-top:4px solid white;
  border-radius:50%;
  animation:spin 1s linear infinite;
  position:absolute;
  z-index:3;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

#job-content {
  padding:20px;
}

.meta {
  color:#6b7280;
  margin-top:6px;
}

.btn {
  background:#2563eb;
  color:white;
  padding:10px 16px;
  border-radius:6px;
  text-decoration:none;
  display:inline-block;
}

.site-footer {
  text-align:center;
  padding:20px;
  color:#6b7280;
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="post.html">Post a job</a>
    <a href="#">Contact</a>
  </div>
</nav>

<div id="job-wrap" class="card-form" style="max-width:900px;margin:18px auto">
  <div id="job-banner" class="job-banner">
    <div class="loader" id="banner-loader"></div>
    <div class="banner-text" id="banner-text"></div>
  </div>
  <div id="job-content">
    <p>Loading job...</p>
  </div>
</div>

<div class="site-footer">&copy; <span id="yr"></span> JobBoard</div>

<script>
document.getElementById('yr').innerText = new Date().getFullYear();

function escapeHtml(s){
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function getParam(n){
  return new URL(location.href).searchParams.get(n);
}

const id = getParam('id');
const jobs = JSON.parse(localStorage.getItem('currentJobs')||'[]');
const job = jobs.find(j=>String(j.__id)===String(id));

const content = document.getElementById("job-content");
const banner = document.getElementById("job-banner");
const bannerText = document.getElementById("banner-text");
const loader = document.getElementById("banner-loader");

if(!job){
  content.innerHTML = "<p>Job not found.</p>";
}
else{

  const title = job.title || job.position || "Job Opportunity";
  const company = job.company_name || "";
  const desc = (job.description||'').replace(/\n+/g,'<br>');
  const types = Array.isArray(job.job_types) ? job.job_types.join(", ") : "";

  // Insert job content
  content.innerHTML = `
    <h2>${escapeHtml(title)}</h2>
    <div class="meta">${escapeHtml(company)} · ${escapeHtml(types)}</div>
    <div style="margin-top:15px">${desc}</div>
    <div style="margin-top:18px">
      <a class="btn" href="apply.html?id=${encodeURIComponent(job.__id)}">
        Apply for this job
      </a>
    </div>
  `;

  // Add overlay text
  bannerText.innerText = title;

  loadBanner(title);
}

  async function loadBanner() {
    try {
      const response = await fetch(API_URL, {
        headers: { Authorization: API_KEY }
      });

      if (!response.ok) {
        const txt = await response.text().catch(()=>'<no body>');
        console.error('Pexels fetch failed', response.status, txt);
        return;
      }

      const data = await response.json();
      const imageUrl = data && data.photos && data.photos[0] && data.photos[0].src && data.photos[0].src.landscape;
      if (!imageUrl) {
        console.warn('No image URL found in Pexels response', data);
        return;
      }
      const allnews = document.querySelector('.job-banner');
      if (allnews) allnews.style.backgroundColor = 'rgba(255,255,255,0.8)'; // add white overlay for better text contrast


      // Preload image
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = imageUrl;

      img.onload = function () {
        allnews.style.backgroundImage = `url("${imageUrl}")`;
       allnews.style.backgroundSize = "cover";
        allnews.style.backgroundPosition = "center";
        allnews.style.backgroundRepeat = "no-repeat";
        if (!allnews.style.minHeight) allnews.style.minHeight = "300px";
        console.log('Banner set from Pexels:', imageUrl);
      };
      img.onerror = function(e){
        console.error('Failed to load banner image', e);
      };
    } catch (error) {
      console.error("Error loading banner:", error);
    }
  }

  loadBanner();
</script>
</body> 
</html>
